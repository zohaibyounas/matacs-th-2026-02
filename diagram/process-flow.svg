<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <rect width="1000" height="1500" fill="#ffffff"/>
  <text x="500" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#111827">MATACS AI Proposal Triage — Process Flow</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/></marker></defs>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#111827">
    <rect x="100" y="100" width="800" height="125" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="500" y="150" font-size="23" font-weight="bold">1. Admin configures criteria</text><text x="500" y="188" font-size="17">Versioned rules and weights stored in database</text>
    <path d="M500 225 V265" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="280" width="800" height="125" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="500" y="330" font-size="23" font-weight="bold">2. Reviewer uploads proposals</text><text x="500" y="368" font-size="17">Validate file type, size, permissions and source hash</text>
    <path d="M500 405 V445" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="460" width="800" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="510" font-size="23" font-weight="bold">3. AI extracts structured facts</text><text x="500" y="548" font-size="17">Evidence excerpts, unknown fields and injection detection</text>
    <path d="M500 585 V625" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="640" width="800" height="125" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="500" y="690" font-size="23" font-weight="bold">4. Validate facts and mandatory checks</text><text x="500" y="728" font-size="17">Schema and rules; send ambiguous cases to human review</text>
    <path d="M500 765 V805" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="820" width="800" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="870" font-size="23" font-weight="bold">5. Deterministic scoring</text><text x="500" y="908" font-size="17">Apply configured formulas; do not hard-code criteria</text>
    <path d="M500 945 V985" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="1000" width="800" height="125" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="500" y="1050" font-size="23" font-weight="bold">6. Generate ranked output</text><text x="500" y="1088" font-size="17">Scores, explanations, evidence and review flags</text>
    <path d="M500 1125 V1165" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="1180" width="800" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="1230" font-size="23" font-weight="bold">7. Human reviews and decides</text><text x="500" y="1268" font-size="17">Clarify, log overrides and make the final award decision</text>
  </g>
  <text x="500" y="1380" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#374151">AI: document understanding | Code: validation, eligibility, scoring and ranking</text>
  <text x="500" y="1410" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#374151">Human: review, clarification, audit and final award decision</text>
</svg>